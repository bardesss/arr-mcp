name: Bug report
description: Something in arr-mcp behaves incorrectly
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two fields below matter more than the rest:
        **which versions you are running**, and **logs**.

        Each service's API changes independently, so a report without versions
        usually cannot be reproduced.

  - type: input
    id: arr-mcp-version
    attributes:
      label: arr-mcp version
      description: The image tag you pulled, or `git rev-parse --short HEAD` if running from source.
      placeholder: '0.2.0'
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker image (ghcr.io/bardesss/arr-mcp)
        - Docker Compose
        - Unraid (Community Applications template)
        - Proxmox LXC (proxmox/ scripts)
        - From source (node)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: services
    attributes:
      label: Which services are involved?
      description: Tick every service the failing request touches. Tick nothing if the problem is in arr-mcp itself.
      options:
        - label: Radarr
        - label: Sonarr
        - label: Lidarr
        - label: Whisparr
        - label: Prowlarr
        - label: Bazarr
        - label: Profilarr
        - label: Jellyfin
        - label: Plex
        - label: Seerr
        - label: SABnzbd
        - label: NZBGet
        - label: Transmission
        - label: qBittorrent
        - label: Cleanuparr
        - label: Reclaimerr
        - label: Dispatcharr
        - label: Shelfmark
        - label: Grimmory

  - type: input
    id: service-versions
    attributes:
      label: Service version(s)
      description: >-
        The version of each service you ticked above. Found in that service's
        own Settings or System page.
      placeholder: 'Radarr 6.3.0.10514, Jellyfin 10.11.2'
    validations:
      required: true

  - type: input
    id: mcp-client
    attributes:
      label: MCP client
      description: Which client was calling arr-mcp, and its version, if the problem involves a tool call.
      placeholder: 'Claude Code 2.1.0'

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the tool you called and the arguments, if applicable.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant output from `docker logs arr-mcp`, the config UI's Logs page,
        or `journalctl -u arr-mcp` on a Proxmox LXC.

        **Redact before pasting.** arr-mcp logs are JSON and normally contain no
        secrets. MCP tokens are shown once on the config page and stored hashed.
        Still check for:

        - Internal hostnames in service URLs that you would rather not publish.
        - With `allow_token_in_url` on, any `?token=` that a reverse-proxy log
          captured.

        Never paste `config.yaml`: it holds every service API key and the token
        hashes.
      render: shell

  - type: checkboxes
    id: redaction
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, MCP tokens and passwords from everything above.
          required: true
