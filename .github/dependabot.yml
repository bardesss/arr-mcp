version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      # One PR for all non-major updates. A solo maintainer reviewing eight
      # separate patch bumps is eight chances to rubber-stamp one.
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint declares a peer range TypeScript has to stay inside,
      # so any bump here is a human decision.
      - dependency-name: "typescript"
      # Node majors touch the Dockerfile, CI and engines together.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # See @types/node above: a Node major is a deliberate, hand-written change.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
