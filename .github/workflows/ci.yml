name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Catches Dockerfile rot on every PR. The probe that let this job skip before
  # a Dockerfile existed is gone: `docker` is now a required status check, so a
  # missing Dockerfile must fail rather than skip green.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # `load: true`, so the image is actually in the local store and can be
      # run. Building it was not enough for arm64 and is not enough here
      # either: a native addon with an unresolvable symbol only fails when
      # loaded, and amd64 is the platform most users are on.
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: arr-mcp:amd64-smoke

      - name: Smoke-test the native-platform native addon
        run: |
          docker run --rm arr-mcp:amd64-smoke             node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values (?)').run(1);console.log('better-sqlite3 ok:', db.prepare('select count(*) c from t').get().c)"

      # release.yml publishes linux/arm64, but this job only built for the
      # runner's own platform, so the arm64 image was first executed by the user
      # who reported 1.6.0 dying on a Raspberry Pi. Building it is not enough —
      # a native addon with an unresolvable symbol only fails when loaded.
      #
      # Single platform with load:true; a multi-platform build cannot be loaded
      # into the local image store.
      - name: Build arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: arr-mcp:arm64-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the arm64 native addon
        run: |
          docker run --rm --platform linux/arm64 arr-mcp:arm64-smoke \
            node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values (?)').run(1);console.log('better-sqlite3 ok:', db.prepare('select count(*) c from t').get().c)"
