name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # Without this, the action falls back to GITHUB_TOKEN and opens the
          # release PR as `app/github-actions`. CI *does* trigger for that PR —
          # but the runs land in `action_required` (queued, 0s, never started),
          # so the `check` and `docker` required status checks never report and
          # the PR sits at mergeStateStatus BLOCKED forever. With
          # enforce_admins: true on main there is no bypass, so every release
          # needed someone to press "Approve and run" in the Actions tab. That
          # is what happened to 0.4.0 and 0.5.0.
          #
          # A PAT is a real account, so its PRs are not bot-gated and CI runs
          # immediately. The `||` fallback keeps releases working before the
          # secret exists: an unset secret is the empty string, which is falsy.
          # Needs contents:write and pull-requests:write on this repo only.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stable releases get X.Y.Z / X.Y / X / latest; every other push to main
      # gets `main` for bleeding edge. Nothing else (design spec §18).
      #
      # Feed `outputs.version` (a bare `0.1.0`) to the semver patterns, not
      # `outputs.tag`. metadata-action parses the value as semver and silently
      # emits nothing when it cannot — so a tag like `arr-mcp-v0.1.0` produced
      # an image with only `latest`, with the job still green.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bardesss/arr-mcp
          tags: |
            type=raw,value=main,enable=${{ needs.release-please.outputs.released != 'true' }}
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.released == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.released == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.released == 'true' }}

      # A release that publishes only `latest` is a silent policy violation, so
      # fail loudly rather than discovering it after the fact.
      - name: Assert the release produced version tags
        if: needs.release-please.outputs.released == 'true'
        run: |
          tags='${{ steps.meta.outputs.tags }}'
          echo "$tags"
          version='${{ needs.release-please.outputs.version }}'
          if ! echo "$tags" | grep -q ":${version}$"; then
            echo "::error::Release ${version} computed no ${version} image tag — got: ${tags}"
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            ARR_MCP_VERSION=${{ needs.release-please.outputs.version || 'main' }}

      # For an audience pulling this onto a machine holding their media library,
      # verifiable provenance is a credibility signal worth five lines.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/bardesss/arr-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Lists the release at registry.modelcontextprotocol.io, which is how MCP
  # clients discover servers. Needs `image`, not just the tag: the registry
  # pulls the image `server.json` names and refuses to publish unless it carries
  # the `io.modelcontextprotocol.server.name` label the Dockerfile sets.
  registry:
    needs: [release-please, image]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # release-please already bumped `.version`, but the image tag lives inside
      # a string it cannot rewrite — so derive both from the release version
      # rather than trusting the file to name the tag this run just pushed.
      - name: Pin server.json to this release
        run: |
          v='${{ needs.release-please.outputs.version }}'
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "ghcr.io/bardesss/arr-mcp:" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      # Pinned and checksummed, unlike the `releases/latest` one-liner upstream
      # documents: this step runs with `id-token: write`, so a binary swapped
      # under `latest` could mint an OIDC token asserting this repository's
      # identity. Bump both values together — see RELEASING.md.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # OIDC, so there is no token to store or rotate: the registry trusts the
      # workflow's own identity, and `io.github.bardesss/*` is ours because the
      # repository is.
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
