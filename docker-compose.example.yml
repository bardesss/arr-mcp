services:
  arr-mcp:
    image: ghcr.io/bardesss/arr-mcp:latest
    container_name: arr-mcp
    ports:
      # Loopback on purpose. The first person to load the setup page owns the
      # instance, and that instance then holds API keys to the whole stack —
      # publishing it on every interface during exactly that window is not a
      # default to ship. Change to `6060:6060` once you have claimed it, or
      # put it behind your reverse proxy.
      - 127.0.0.1:6060:6060
    volumes:
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:6060/healthz']

# Nothing to read out of the log. Start it, open http://<host>:6060, and choose
# a username and password on the setup page — then add your services from the
# Configuration page. Saving applies immediately; no restart.
#
# Claim it before exposing the port: until you do, whoever loads that page
# first owns the instance.
